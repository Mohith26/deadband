name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Deadband.sln
      - run: dotnet build Deadband.sln -c Release --no-restore
      - name: Lint alarm configuration (config as code gate)
        run: dotnet src/Deadband.Cli/bin/Release/net8.0/Deadband.Cli.dll validate config/*.json
      - name: Unit + integration tests
        run: dotnet test Deadband.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: tests/**/TestResults/*.trx

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  benchmark:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: scripts/get-data.sh data/tep-full
      - run: dotnet build src/Deadband.Cli -c Release
      - name: Re-run the alarm benchmark on the full TEP data set
        run: dotnet src/Deadband.Cli/bin/Release/net8.0/Deadband.Cli.dll evaluate --data data/tep-full --out ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ci-results.json
